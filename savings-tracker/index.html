<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自由存钱账本 & 365天挑战 | 智能资产金库</title>
    <meta name="description" content="高颜值自由存钱金库系统。支持自定义存入任意金额、快捷加码、365天存钱格打卡与详细存钱流水账本。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="glow-bg-effects"></div>

    <div class="app-container">
        <!-- Header & Target Settings -->
        <header class="app-header">
            <div class="header-brand">
                <div class="coin-logo glow-gold">💎</div>
                <div>
                    <h1>智能财富金库</h1>
                    <p class="subtitle">自由存钱 · 零钱聚宝盆 · 轻松存出大梦想</p>
                </div>
            </div>
            <div class="target-setting-bar">
                <div class="setting-item">
                    <span class="s-label">存钱总目标 (元)</span>
                    <input type="number" id="customTargetInput" value="10000" min="100" step="100" class="input-target">
                </div>
                <div class="setting-item">
                    <span class="s-label">目标名称</span>
                    <input type="text" id="targetNameInput" value="我的第一桶金 🚀" class="input-name">
                </div>
            </div>
        </header>

        <!-- Main Dashboard Split -->
        <main class="main-dashboard-grid">
            <!-- Left: Custom Deposit Interactive Console -->
            <section class="deposit-console-card">
                <div class="card-header">
                    <h2>⚡ 随时存一笔 (自定义金额)</h2>
                    <span class="badge-gold">即时记账</span>
                </div>

                <!-- Custom Money Input Bar -->
                <form id="customDepositForm" class="deposit-input-form">
                    <div class="input-amount-wrapper">
                        <span class="currency-prefix">¥</span>
                        <input type="number" id="inputDepositAmount" placeholder="输入你想存入的金额" min="1" max="100000" step="1" required autofocus>
                    </div>

                    <!-- Quick Amount Preset Chips -->
                    <div class="quick-preset-chips">
                        <button type="button" class="preset-chip" data-val="10">+ ¥10</button>
                        <button type="button" class="preset-chip" data-val="20">+ ¥20</button>
                        <button type="button" class="preset-chip" data-val="50">+ ¥50</button>
                        <button type="button" class="preset-chip" data-val="100">+ ¥100</button>
                        <button type="button" class="preset-chip" data-val="500">+ ¥500</button>
                    </div>

                    <button type="submit" class="btn btn-gold-gradient btn-large full-width glow-btn">
                        💰 确认存入此笔金额
                    </button>
                </form>

                <!-- History Log Feed -->
                <div class="history-section">
                    <div class="history-header">
                        <h3>📜 存钱流水记录</h3>
                        <button class="btn-text" id="btnClearHistory">清空记录</button>
                    </div>
                    <ul class="history-list" id="historyList">
                        <!-- Dynamic history items -->
                    </ul>
                </div>
            </section>

            <!-- Right: Real-time Stats & Savings Ring -->
            <section class="stats-overview-card">
                <div class="overall-progress-box">
                    <div class="circle-progress-wrapper">
                        <svg class="progress-ring" width="180" height="180">
                            <circle class="progress-ring-bg" stroke="rgba(255,255,255,0.08)" stroke-width="12" fill="transparent" r="75" cx="90" cy="90"/>
                            <circle class="progress-ring-circle" id="ringCircle" stroke="url(#goldGradient)" stroke-width="12" stroke-dasharray="471" stroke-dashoffset="471" fill="transparent" r="75" cx="90" cy="90"/>
                            <defs>
                                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#f59e0b" />
                                    <stop offset="100%" stop-color="#10b981" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="ring-center-text">
                            <span class="percent-val" id="percentText">0%</span>
                            <span class="percent-lbl">达成进度</span>
                        </div>
                    </div>

                    <div class="big-metrics-group">
                        <div class="big-metric">
                            <span class="bm-label">已累计存入总额</span>
                            <div class="bm-val gold-text"><span class="sym">¥</span><span id="savedTotalVal">0</span></div>
                        </div>
                        <div class="big-metric">
                            <span class="bm-label">距目标还差</span>
                            <div class="bm-val muted-text"><span class="sym">¥</span><span id="remainingVal">10,000</span></div>
                        </div>
                    </div>
                </div>

                <!-- Secondary Stats Grid -->
                <div class="mini-stats-grid">
                    <div class="mini-stat">
                        <span class="ms-lbl">存款笔数</span>
                        <span class="ms-val" id="depositTimes">0 笔</span>
                    </div>
                    <div class="mini-stat">
                        <span class="ms-lbl">连续打卡</span>
                        <span class="ms-val" id="streakDays">0 天 🔥</span>
                    </div>
                    <div class="mini-stat">
                        <span class="ms-lbl">单笔最大存入</span>
                        <span class="ms-val" id="maxDeposit">¥0</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Interactive Grid Board Section (365 Grid Matrix) -->
        <section class="grid-matrix-card">
            <div class="matrix-header">
                <div>
                    <h2>🗓️ 365天/自定义金额格子盲盒打卡</h2>
                    <p class="sub">点击下方任意格子，亦可自定义填写该格子的存入数额</p>
                </div>
                <div class="filter-group">
                    <button class="chip active" data-filter="all">全部格子</button>
                    <button class="chip" data-filter="pending">未完成</button>
                    <button class="chip" data-filter="done">已存入</button>
                </div>
            </div>

            <div class="grid-board" id="gridBoard">
                <!-- Dynamically generated 365 cells -->
            </div>
        </section>
    </div>

    <!-- Custom Cell Amount Modal -->
    <div class="modal-overlay" id="cellModal">
        <div class="modal-card">
            <div class="modal-icon">✏️</div>
            <h3>设置该格子的存钱金额</h3>
            <p>请输入本天/本格准备存入的任意数额：</p>
            <div class="modal-input-box">
                <span class="sym">¥</span>
                <input type="number" id="cellModalInput" min="1" max="100000" placeholder="例如: 88">
            </div>
            <div class="modal-btn-row">
                <button class="btn btn-outline" id="btnCancelCellModal">取消</button>
                <button class="btn btn-gold-gradient" id="btnConfirmCellModal">存入此金额 💰</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
